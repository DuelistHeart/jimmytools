site_name: JimmyTools Wiki
site_description: Documentation for JimmyTools, a Fabric mod for the Lords of Minecraft 2 server.
site_url: https://duelistheart.github.io/jimmytools/
repo_url: https://github.com/DuelistHeart/jimmytools
repo_name: DuelistHeart/jimmytools
edit_uri: edit/main/docs/

theme:
  name: material
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: deep purple
      accent: purple
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: deep purple
      accent: purple
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  features:
    - navigation.sections
    - navigation.top
    - navigation.footer
    - search.suggest
    - content.action.edit
    - content.code.copy

markdown_extensions:
  - admonition
  - tables
  - attr_list
  - pymdownx.keys
  - toc:
      permalink: true

nav:
  - Home: index.md
  - Getting Started:
      - Installation: installation.md
      - Keybinds: keybinds.md
      - Configuration: configuration.md
  - Features:
      - Bag Hotkeys: features/bag-hotkeys.md
      - Transformations: features/transformations.md
      - Custom Tab List: features/custom-tablist.md
      - Level-Up Messages: features/level-up-messages.md
      - Startup Commands: features/startup-commands.md
  - Help:
      - FAQ: faq.md
      - Building from Source: building.md
